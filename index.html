<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Enlighten Learning</title>

  <!-- Static fallbacks for crawlers that do not run scripts (social previews).
       They carry data-rh so the per-page tags written by src/kit/Seo.jsx replace
       them once the app is running. -->
  <!-- Primary Meta Tags -->
  <meta name="title" content="Enlighten Learning" data-rh="true" />
  <meta name="description" content="Empowering communities through education, tutoring services, and volunteer programs." data-rh="true" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" data-rh="true" />
  <meta property="og:url" content="https://enlightenlearning.vercel.app/" data-rh="true" />
  <meta property="og:title" content="Enlighten Learning" data-rh="true" />
  <meta property="og:description" content="Empowering communities through education, tutoring services, and volunteer programs." data-rh="true" />
  <meta property="og:image" content="https://enlightenlearning.vercel.app/og/default.png" data-rh="true" />
  <meta property="og:site_name" content="Enlighten Learning" data-rh="true" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" data-rh="true" />
  <meta property="twitter:url" content="https://enlightenlearning.vercel.app/" data-rh="true" />
  <meta property="twitter:title" content="Enlighten Learning" data-rh="true" />
  <meta property="twitter:description" content="Empowering communities through education, tutoring services, and volunteer programs." data-rh="true" />
  <meta property="twitter:image" content="https://enlightenlearning.vercel.app/og/default.png" data-rh="true" />

  <link rel="icon" type="image/png" href="/images/logo/Logo.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- Self-hosted fonts, preloaded so headings and text paint in the right face -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces-latin-opsz-normal.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-wght-normal.woff2" crossorigin />
  <!-- Pre-paint: read the remembered color mode, the motion setting and any
       season preview from the query string before anything renders, so there
       is no flash of the wrong canvas. The React theme reads the same keys. -->
  <script>
    (function () {
      try {
        var root = document.documentElement;
        var mode = localStorage.getItem("el-mode");
        var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        root.setAttribute("data-theme", dark ? "dark" : "light");
        if (localStorage.getItem("el-motion") === "off") root.setAttribute("data-motion", "off");
        var params = new URLSearchParams(window.location.search);
        var season = params.get("season");
        if (season === "halloween" || season === "christmas") root.setAttribute("data-season", season);
      } catch (error) {
        /* Storage can be blocked; the defaults are light mode and motion on */
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
